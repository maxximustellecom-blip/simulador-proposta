<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Leads • Maxximus Telecom</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="card-head">
                <div class="card-title">
                    <span>Meus Leads</span>&nbsp;
                    <span class="chip">Vinculados a mim</span>
                </div>
            </div>
            <div class="card-body">
                <section class="section filters-section-sticky" style="margin-top: 20px;">
                    <div id="filtersLeads" class="filters">
                        <div>
                            <div class="label">Buscar</div>
                            <input id="leadsFilterText" class="input" type="text" placeholder="Nome, CNPJ ou Contato">
                        </div>
                        <div style="margin-left: 1rem;">
                            <div class="label">Status</div>
                            <select id="leadsFilterStatus" class="select" style="min-width: 150px;">
                                <option value="">Todos</option>
                                <option value="apto">Apto</option>
                                <option value="nao_apto">Não Apto</option>
                                <option value="pendente">Pendente</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:flex-end; gap:0.5rem; margin-left:auto; justify-content:flex-end;">
                            <button id="leadsFilterClear" class="btn btn-ghost" type="button" title="Limpar">
                                <i data-lucide="rotate-ccw"></i>
                                <span>Limpar</span>
                            </button>
                        </div>
                    </div>
                </section>
                <section class="section" style="margin-top: 10px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div class="label">Lista de Leads</div>
                        <div class="muted" id="leadsCount">0 itens</div>
                    </div>
                    <div id="leadsContainer" style="margin-top:0.75rem;">
                        <div class="table-container">
                             <table>
                                <thead>
                                    <tr>
                                        <th>CNPJ</th>
                                        <th>Nome</th>
                                        <th>Contato</th>
                                        <th>Endereço</th>
                                        <th style="min-width:140px;">Data</th>
                                        <th class="col-actions" style="width: 180px;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="leadsTbody">
                                    <tr>
                                        <td colspan="6">
                                            <div class="skeleton skel-row"></div>
                                            <div class="skeleton skel-row"></div>
                                            <div class="skeleton skel-row"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Detalhes do Lead</div>
                <button id="feedbackClose" class="btn btn-ghost btn-icon" type="button"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="label" style="margin-bottom:0.5rem; display:block;">Status</label>
                    <select id="feedbackStatus" class="select">
                        <option value="">Selecione...</option>
                        <option value="apto">Apto</option>
                        <option value="nao_apto">Não Apto</option>
                    </select>
                </div>
                <br>
                <div class="form-group">
                    <label class="label" style="margin-bottom:0.5rem; display:block;">Feedback / Observações</label>
                    <textarea id="feedbackInput" class="input" rows="5" placeholder="Digite as observações sobre este lead..."></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button id="feedbackCancel" class="btn" type="button">Cancelar</button>
                <button id="feedbackSave" class="btn btn-primary" type="button">Salvar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'https://others-maxximus-backend.pvuzyy.easypanel.host';
        let __leadsCache = [];
        let __currentLeadId = null;
        let __currentPage = 1;
        const __itemsPerPage = 10;
        let __currentFilteredLeads = [];

        function changePage(delta) {
            __currentPage += delta;
            renderLeads(__currentFilteredLeads);
            document.getElementById('leadsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.borderColor = type === 'error' ? 'rgba(239,68,68,0.35)' : 'rgba(16,185,129,0.35)';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        async function api(path, options = {}) {
            const authRaw = localStorage.getItem('authUser');
            let headers = { 'Content-Type': 'application/json' };
            try {
                const u = JSON.parse(authRaw || '{}');
                if (u && u.id) headers['x-user-id'] = String(u.id);
                if (u && u.role) headers['x-user-role'] = String(u.role);
                if (u && u.name) headers['x-user-name'] = String(u.name);
            } catch {}
            if (options.body instanceof FormData) {
                delete headers['Content-Type'];
            }
            const res = await fetch(API_BASE + path, { ...options, headers });
            if (!res.ok) {
                const err = await res.json().catch(function () { return {}; });
                throw new Error(err.error || ('HTTP ' + res.status));
            }
            return await res.json();
        }

        function formatDate(iso) {
            if (!iso) return '-';
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return iso;
                return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch { return iso; }
        }

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            const countEl = document.getElementById('leadsCount');
            try {
                const leads = await api('/leads/mine');
                __leadsCache = leads;
                __currentFilteredLeads = leads;
                renderLeads(leads);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="muted" style="text-align:center; padding: 2rem; color: var(--danger);">Erro ao carregar leads: ' + err.message + '</div>';
                countEl.textContent = '-';
            }
        }

        function getCleanPhone(contact) {
            if (!contact) return '';
            // Remove tudo que não é dígito
            return contact.replace(/\D/g, '');
        }

        function toggleAccordion(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.accordion-icon');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderLeads(leads) {
            const container = document.getElementById('leadsContainer');
            const countEl = document.getElementById('leadsCount');
            
            // Update current filtered context
            __currentFilteredLeads = leads || [];
            
            if (!leads || !leads.length) {
                container.innerHTML = '<div class="muted" style="text-align:center; padding: 2rem;">Nenhum lead encontrado</div>';
                countEl.textContent = '0 itens';
                return;
            }

            countEl.textContent = leads.length + ' itens';
            
            // Group by batch
            const groups = {};
            leads.forEach(l => {
                const bid = l.batch_id || 'avulso';
                if (!groups[bid]) {
                    groups[bid] = {
                        id: bid,
                        name: l.batch_name || 'Leads Avulsos',
                        date: l.batch_date || l.created_at,
                        leads: []
                    };
                }
                groups[bid].leads.push(l);
            });
            
            // Sort groups by date DESC
            const sortedGroups = Object.values(groups).sort((a, b) => {
                const da = new Date(a.date || 0);
                const db = new Date(b.date || 0);
                return db - da;
            });

            // Pagination Logic
            const totalPages = Math.ceil(sortedGroups.length / __itemsPerPage);
            if (__currentPage > totalPages) __currentPage = totalPages || 1;
            if (__currentPage < 1) __currentPage = 1;

            const start = (__currentPage - 1) * __itemsPerPage;
            const end = start + __itemsPerPage;
            const pageGroups = sortedGroups.slice(start, end);

            const groupsHtml = pageGroups.map(g => {
                const dateStr = formatDate(g.date).split(' ')[0];
                const count = g.leads.length;
                
                const rows = g.leads.map(l => {
                    let rowStyle = '';
                    if (l.status === 'apto') rowStyle = 'background-color: rgba(34, 197, 94, 0.1);';
                    else if (l.status === 'nao_apto') rowStyle = 'background-color: rgba(239, 68, 68, 0.1);';

                    const phone = getCleanPhone(l.contato);
                    const waBtn = phone ? 
                        `<a href="https://wa.me/55${phone}" target="_blank" class="btn btn-ghost btn-icon" title="WhatsApp" style="color:#25D366;"><i data-lucide="message-circle"></i></a>` : 
                        `<button class="btn btn-ghost btn-icon" disabled style="opacity:0.3;"><i data-lucide="message-circle"></i></button>`;
                    
                    const feedbackBtn = `<button onclick="openFeedback(${l.id})" class="btn btn-ghost btn-icon" title="Observações"><i data-lucide="message-square"></i> feedback</button>`;

                    return (
                        `<tr style="${rowStyle}">` +
                            '<td>' + (l.cnpj || '-') + '</td>' +
                            '<td>' + (l.nome || '-') + '</td>' +
                            '<td>' + (l.contato || '-') + '</td>' +
                            '<td>' + (l.endereco || '-') + '</td>' +
                            '<td>' + formatDate(l.created_at) + '</td>' +
                            '<td class="col-actions">' +
                                '<div style="display:flex; align-items:center; justify-content:flex-end; gap:0.3rem;">' +
                                    waBtn +
                                    feedbackBtn +
                                '</div>' +
                            '</td>' +
                        '</tr>'
                    );
                }).join('');

                return `
                <div class="accordion-item" style="border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.8rem; overflow: hidden; background: var(--surface);">
                    <button class="accordion-header" onclick="toggleAccordion(this)" style="width: 100%; text-align: left; padding: 1rem; background: var(--surface); border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text);">
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <i data-lucide="folder"></i>
                            <span style="font-weight:600;">${g.name}</span>
                            <span class="muted" style="font-size: 0.85rem; font-weight:400;">• ${count} leads • ${dateStr}</span>
                        </div>
                        <i data-lucide="chevron-down" class="accordion-icon" style="transition: transform 0.2s;"></i>
                    </button>
                    <div class="accordion-content" style="display: none; border-top: 1px solid var(--border);">
                        <div class="table-container" style="border:none; border-radius:0;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>CNPJ</th>
                                        <th>Nome</th>
                                        <th>Contato</th>
                                        <th>Endereço</th>
                                        <th style="min-width:140px;">Data</th>
                                        <th class="col-actions" style="width: 180px;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            // Pagination Controls
            let paginationHtml = '';
            if (totalPages > 1) {
                paginationHtml = `
                <div class="pagination" style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1.5rem; padding-bottom: 1rem;">
                    <button class="btn btn-ghost" onclick="changePage(-1)" ${__currentPage === 1 ? 'disabled' : ''}>
                        <i data-lucide="chevron-left"></i> Anterior
                    </button>
                    <span class="muted" style="font-variant-numeric: tabular-nums;">Página ${__currentPage} de ${totalPages}</span>
                    <button class="btn btn-ghost" onclick="changePage(1)" ${__currentPage === totalPages ? 'disabled' : ''}>
                        Próximo <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                `;
            }

            container.innerHTML = groupsHtml + paginationHtml;
            
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function openFeedback(id) {
            __currentLeadId = id;
            const lead = __leadsCache.find(l => l.id === id);
            
            const input = document.getElementById('feedbackInput');
            input.value = lead ? (lead.feedback || '') : '';
            
            const statusSelect = document.getElementById('feedbackStatus');
            statusSelect.value = lead ? (lead.status || '') : '';
            
            const modal = document.getElementById('feedbackModal');
            modal.classList.add('show');
        }

        function closeFeedback() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.remove('show');
            __currentLeadId = null;
        }

        async function saveFeedback() {
            if (!__currentLeadId) return;
            
            const input = document.getElementById('feedbackInput');
            const feedback = input.value;
            
            const statusSelect = document.getElementById('feedbackStatus');
            const status = statusSelect.value;
            
            try {
                await api('/leads/' + __currentLeadId, { 
                    method: 'PUT', 
                    body: JSON.stringify({ feedback, status }) 
                });
                
                const lead = __leadsCache.find(l => l.id === __currentLeadId);
                if (lead) {
                    lead.feedback = feedback;
                    lead.status = status;
                }
                
                // Re-render to update row colors
                renderLeads(__currentFilteredLeads);
                
                closeFeedback();
                toast('Salvo com sucesso!', 'success');
            } catch (err) {
                toast('Erro ao salvar: ' + err.message, 'error');
            }
        }

        function setupFilters() {
            const filterText = document.getElementById('leadsFilterText');
            const filterStatus = document.getElementById('leadsFilterStatus');
            const btnClear = document.getElementById('leadsFilterClear');
            
            // Modal events
            document.getElementById('feedbackClose').addEventListener('click', closeFeedback);
            document.getElementById('feedbackCancel').addEventListener('click', closeFeedback);
            document.getElementById('feedbackSave').addEventListener('click', saveFeedback);

            function apply() {
                const txt = (filterText.value || '').toLowerCase();
                const status = filterStatus.value;

                const filtered = __leadsCache.filter(l => {
                    // Text filter
                    const str = [
                        l.cnpj, 
                        l.nome, 
                        l.contato, 
                        l.endereco
                    ].map(s => String(s || '').toLowerCase()).join(' ');
                    const matchText = str.includes(txt);

                    // Status filter
                    let matchStatus = true;
                    if (status) {
                        if (status === 'pendente') {
                            matchStatus = !l.status;
                        } else {
                            matchStatus = l.status === status;
                        }
                    }

                    return matchText && matchStatus;
                });
                __currentPage = 1;
                renderLeads(filtered);
            }

            filterText.addEventListener('input', apply);
            filterStatus.addEventListener('change', apply);
            btnClear.addEventListener('click', () => {
                filterText.value = '';
                filterStatus.value = '';
                apply();
            });
        }

        async function checkAuth() {
            const authRaw = localStorage.getItem('authUser');
            if (!authRaw) {
                window.location.href = 'index.html';
                return;
            }
            try {
                const u = JSON.parse(authRaw);
                const label = document.getElementById('userNameLabel');
                if (label && u && u.name) label.textContent = u.name;
            } catch {
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            setupFilters();
            loadLeads();
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
