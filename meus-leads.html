<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Leads • Maxximus Telecom</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="card-head">
                <div class="card-title">
                    <span>Meus Leads</span>&nbsp;
                    <span class="chip">Vinculados a mim</span>
                </div>
            </div>
            <div class="card-body">
                <section class="section filters-section-sticky" style="margin-top: 20px;">
                    <div id="filtersLeads" class="filters">
                        <div style="flex: 1; min-width: 200px;">
                            <div class="label">Buscar</div>
                            <input id="leadsFilterText" class="input" type="text" placeholder="Nome, CNPJ ou Contato">
                        </div>
                        <div style="flex: 1; min-width: 150px;">
                            <div class="label">Status</div>
                            <select id="leadsFilterStatus" class="select" style="min-width: 150px;">
                                <option value="">Todos</option>
                                <option value="lead_interessado">Em Negociação</option>
                                <option value="lead_nao_interessado">Lead Não Interessado</option>
                                <option value="aguardando_contato">Aguardando Contato</option>
                                <option value="pendente">Pendente</option>
                            </select>
                        </div>
                        <div id="divFilterVendedor" style="flex: 1; min-width: 150px; display: none;">
                            <div class="label">Vendedor</div>
                            <select id="fVendedor" class="select" style="min-width: 150px;">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:flex-end; gap:0.5rem;">
                            <button id="leadsFilterClear" class="btn btn-ghost" type="button" title="Limpar">
                                <i data-lucide="rotate-ccw"></i>
                                <span>Limpar</span>
                            </button>
                        </div>
                    </div>
                </section>
                <section class="section" style="margin-top: 10px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div class="label">Lista de Leads</div>
                        <div class="muted" id="leadsCount">0 itens</div>
                    </div>
                    <div id="leadsContainer" style="margin-top:0.75rem;">
                        <div class="table-container">
                             <table>
                                <thead>
                                    <tr>
                                        <th>CNPJ</th>
                                        <th>Nome</th>
                                        <th>Contato</th>
                                        <th>Endereço</th>
                                        <th style="min-width:140px;">Data</th>
                                        <th class="col-actions" style="width: 180px;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="leadsTbody">
                                    <tr>
                                        <td colspan="6">
                                            <div class="skeleton skel-row"></div>
                                            <div class="skeleton skel-row"></div>
                                            <div class="skeleton skel-row"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Detalhes do Lead</div>
                <button id="feedbackClose" class="btn btn-ghost btn-icon" type="button"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="label" style="margin-bottom:0.5rem; display:block;">Status</label>
                    <select id="feedbackStatus" class="select">
                        <option value="">Selecione...</option>
                        <option value="lead_interessado">Em Negociação</option>
                        <option value="lead_nao_interessado">Lead Não Interessado</option>
                        <option value="aguardando_contato">Aguardando Contato</option>
                    </select>
                </div>
                <div class="form-group" id="scheduledDateWrapper" style="display:none; margin-top: 1rem;">
                    <label class="label" style="margin-bottom:0.5rem; display:block;">Data e Hora do Contato</label>
                    <input id="feedbackDate" class="input" type="datetime-local">
                </div>
                <br>
                <div class="form-group">
                    <label class="label" style="margin-bottom:0.5rem; display:block;">Feedback / Observações</label>
                    <textarea id="feedbackInput" class="input" rows="5" placeholder="Digite as observações sobre este lead..."></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button id="feedbackCancel" class="btn" type="button">Cancelar</button>
                <button id="feedbackSave" class="btn btn-primary" type="button">Salvar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'https://others-maxximus-backend.pvuzyy.easypanel.host';
        let __leadsCache = [];
        let __currentLeadId = null;
        let __currentPage = 1;
        const __itemsPerPage = 10;
        let __currentFilteredLeads = [];

        function changePage(delta) {
            __currentPage += delta;
            renderLeads(__currentFilteredLeads);
            document.getElementById('leadsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.borderColor = type === 'error' ? 'rgba(239,68,68,0.35)' : 'rgba(16,185,129,0.35)';
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        async function api(path, options = {}) {
            const authRaw = localStorage.getItem('authUser');
            let headers = { 'Content-Type': 'application/json' };
            try {
                const u = JSON.parse(authRaw || '{}');
                if (u && u.id) headers['x-user-id'] = String(u.id);
                if (u && u.role) headers['x-user-role'] = String(u.role);
                if (u && u.name) headers['x-user-name'] = String(u.name);
            } catch {}
            
            // Build Query String if params exist
            let queryStr = '';
            if (options.params) {
                const sp = new URLSearchParams();
                for (const k in options.params) {
                    if (options.params[k] !== null && options.params[k] !== undefined && options.params[k] !== '') {
                        sp.append(k, options.params[k]);
                    }
                }
                const qs = sp.toString();
                if (qs) queryStr = '?' + qs;
            }

            if (options.body instanceof FormData) {
                delete headers['Content-Type'];
            }
            
            // Remove params from options before fetch to avoid passing it to fetch
            const fetchOptions = { ...options };
            delete fetchOptions.params;

            const res = await fetch(API_BASE + path + queryStr, { ...fetchOptions, headers });
            if (!res.ok) {
                const err = await res.json().catch(function () { return {}; });
                throw new Error(err.error || ('HTTP ' + res.status));
            }
            return await res.json();
        }

        function formatDate(iso) {
            if (!iso) return '-';
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return iso;
                return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch { return iso; }
        }

        async function carregarUsuariosSelect() {
            try {
                const auth = localStorage.getItem('authUser');
                const u = JSON.parse(auth || '{}');
                if (u.role !== 'admin') return;

                const list = await api('/auth/users', { method: 'GET' }).catch(() => []);
                const arr = Array.isArray(list) ? list : [];
                
                const html = '<option value="">Todos</option>' + arr.map(user => `<option value="${user.id}">${user.name}</option>`).join('');
                
                const selectFilter = document.getElementById('fVendedor');
                const divFilter = document.getElementById('divFilterVendedor');
                
                if (selectFilter) {
                    selectFilter.innerHTML = html;
                    if (divFilter) divFilter.style.display = 'block';
                    selectFilter.addEventListener('change', () => loadLeads());
                }
            } catch {}
        }

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            const countEl = document.getElementById('leadsCount');
            
            const txt = document.getElementById('leadsFilterText').value;
            const status = document.getElementById('leadsFilterStatus').value;
            const sellerId = document.getElementById('fVendedor') ? document.getElementById('fVendedor').value : '';

            try {
                const leads = await api('/leads/mine', { 
                    params: { 
                        q: txt, 
                        status: status,
                        seller_id: sellerId
                    } 
                });
                __leadsCache = leads;
                __currentFilteredLeads = leads;
                renderLeads(leads);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="muted" style="text-align:center; padding: 2rem; color: var(--danger);">Erro ao carregar leads: ' + err.message + '</div>';
                countEl.textContent = '-';
            }
        }

        function getCleanPhone(contact) {
            if (!contact) return '';
            // Remove tudo que não é dígito
            return contact.replace(/\D/g, '');
        }

        function exportBatch(batchId) {
            const leadsToExport = __leadsCache.filter(l => {
                const bid = l.batch_id || 'avulso';
                return String(bid) === String(batchId);
            });

            if (!leadsToExport.length) {
                toast('Sem leads para exportar', 'error');
                return;
            }

            const headers = ['CNPJ', 'Nome', 'Contato', 'Endereço', 'Status', 'Data Importação', 'Feedback'];
            const csvContent = [
                headers.join(';'),
                ...leadsToExport.map(l => {
                    const row = [
                        l.cnpj || '',
                        l.nome || '',
                        l.contato || '',
                        l.endereco || '',
                        l.status || 'pendente',
                        formatDate(l.created_at),
                        l.feedback ? l.feedback.replace(/[\n\r]+/g, ' ') : ''
                    ];
                    return row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';');
                })
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `leads_export_${batchId}_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleAccordion(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.accordion-icon');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderLeads(leads, openBatchId = null) {
            const container = document.getElementById('leadsContainer');
            const countEl = document.getElementById('leadsCount');
            
            // Update current filtered context
            __currentFilteredLeads = leads || [];
            
            if (!leads || !leads.length) {
                container.innerHTML = '<div class="muted" style="text-align:center; padding: 2rem;">Nenhum lead encontrado</div>';
                countEl.textContent = '0 itens';
                return;
            }

            countEl.textContent = leads.length + ' itens';
            
            // Group by batch
            const groups = {};
            leads.forEach(l => {
                const bid = l.batch_id || 'avulso';
                if (!groups[bid]) {
                    groups[bid] = {
                        id: bid,
                        name: l.batch_name || 'Leads Avulsos',
                        date: l.batch_date || l.created_at,
                        leads: []
                    };
                }
                groups[bid].leads.push(l);
            });
            
            // Sort groups by date DESC
            const sortedGroups = Object.values(groups).sort((a, b) => {
                const da = new Date(a.date || 0);
                const db = new Date(b.date || 0);
                return db - da;
            });

            // Pagination Logic
            const totalPages = Math.ceil(sortedGroups.length / __itemsPerPage);
            if (__currentPage > totalPages) __currentPage = totalPages || 1;
            if (__currentPage < 1) __currentPage = 1;

            const start = (__currentPage - 1) * __itemsPerPage;
            const end = start + __itemsPerPage;
            const pageGroups = sortedGroups.slice(start, end);

            const groupsHtml = pageGroups.map(g => {
                const dateStr = formatDate(g.date).split(' ')[0];
                const count = g.leads.length;

                const isOpen = openBatchId && String(g.id) === String(openBatchId);
                const displayStyle = isOpen ? 'display: block;' : 'display: none;';
                const iconTransform = isOpen ? 'transform: rotate(180deg);' : '';
                
                const rows = g.leads.map(l => {
                    let rowStyle = '';
                    if (l.status === 'lead_interessado') rowStyle = 'background-color: rgba(34, 197, 94, 0.1);'; // Green
                    else if (l.status === 'lead_nao_interessado') rowStyle = 'background-color: rgba(239, 68, 68, 0.1);'; // Red
                    else if (l.status === 'aguardando_contato') rowStyle = 'background-color: rgba(59, 130, 246, 0.1);'; // Blue
                    else if (l.status === 'apto') rowStyle = 'background-color: rgba(34, 197, 94, 0.1);'; // Legacy support
                    else if (l.status === 'nao_apto') rowStyle = 'background-color: rgba(239, 68, 68, 0.1);'; // Legacy support

                    const phone = getCleanPhone(l.contato);
                    const waBtn = phone ? 
                        `<a href="https://wa.me/55${phone}" target="_blank" class="btn btn-ghost btn-icon" title="WhatsApp" style="color:#25D366;"><i data-lucide="message-circle"></i></a>` : 
                        `<button class="btn btn-ghost btn-icon" disabled style="opacity:0.3;"><i data-lucide="message-circle"></i></button>`;
                    
                    const feedbackBtn = `<button onclick="openFeedback(${l.id})" class="btn btn-ghost btn-icon" title="Observações"><i data-lucide="message-square"></i> feedback</button>`;

                    return (
                        `<tr style="${rowStyle}">` +
                            '<td>' + (l.cnpj || '-') + '</td>' +
                            '<td>' + (l.nome || '-') + '</td>' +
                            '<td>' + (l.contato || '-') + '</td>' +
                            '<td>' + (l.endereco || '-') + '</td>' +
                            '<td>' + formatDate(l.created_at) + '</td>' +
                            '<td class="col-actions">' +
                                '<div style="display:flex; align-items:center; justify-content:flex-end; gap:0.3rem;">' +
                                    waBtn +
                                    feedbackBtn +
                                '</div>' +
                            '</td>' +
                        '</tr>'
                    );
                }).join('');

                return `
                <div class="accordion-item" style="border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.8rem; overflow: hidden; background: var(--surface);">
                    <div class="accordion-header" onclick="toggleAccordion(this)" style="text-align: left; padding: 1rem; background: var(--surface); border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text);">
                        <div style="display:flex; align-items:center; gap:0.5rem; flex: 1; min-width: 0; padding-right: 10px;">
                            <button type="button" class="btn btn-ghost btn-icon" title="Exportar CSV" onclick="event.stopPropagation(); exportBatch('${g.id}')">
                                <i data-lucide="download"></i>
                            </button>
                            <i data-lucide="folder" style="flex-shrink: 0;"></i>
                            <span style="font-weight:600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${g.name}</span>
                            <span class="muted" style="font-size: 0.85rem; font-weight:400; white-space: nowrap; flex-shrink: 0;">• ${count} leads • ${dateStr}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink: 0;">
                            <i data-lucide="chevron-down" class="accordion-icon" style="transition: transform 0.2s; ${iconTransform}"></i>
                        </div>
                    </div>
                    <div class="accordion-content" style="${displayStyle} border-top: 1px solid var(--border);">
                        <div class="table-container" style="border:none; border-radius:0;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>CNPJ</th>
                                        <th>Nome</th>
                                        <th>Contato</th>
                                        <th>Endereço</th>
                                        <th style="min-width:140px;">Data</th>
                                        <th class="col-actions" style="width: 180px;">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            // Pagination Controls
            let paginationHtml = '';
            if (totalPages > 1) {
                paginationHtml = `
                <div class="pagination" style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1.5rem; padding-bottom: 1rem;">
                    <button class="btn btn-ghost" onclick="changePage(-1)" ${__currentPage === 1 ? 'disabled' : ''}>
                        <i data-lucide="chevron-left"></i> Anterior
                    </button>
                    <span class="muted" style="font-variant-numeric: tabular-nums;">Página ${__currentPage} de ${totalPages}</span>
                    <button class="btn btn-ghost" onclick="changePage(1)" ${__currentPage === totalPages ? 'disabled' : ''}>
                        Próximo <i data-lucide="chevron-right"></i>
                    </button>
                </div>
                `;
            }

            container.innerHTML = groupsHtml + paginationHtml;
            
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }

        function openFeedback(id) {
            __currentLeadId = id;
            const lead = __leadsCache.find(l => l.id === id);
            
            const input = document.getElementById('feedbackInput');
            input.value = lead ? (lead.feedback || '') : '';
            
            const statusSelect = document.getElementById('feedbackStatus');
            const currentStatus = lead ? (lead.status || '') : '';
            statusSelect.value = currentStatus;
            
            const dateWrapper = document.getElementById('scheduledDateWrapper');
            const dateInput = document.getElementById('feedbackDate');
            
            if (dateWrapper && dateInput) {
                let dateVal = '';
                if (lead && lead.contact_scheduled_at) {
                    try {
                        const d = new Date(lead.contact_scheduled_at);
                        if (!isNaN(d.getTime())) {
                            dateVal = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                        }
                    } catch {}
                }
                dateInput.value = dateVal;
                
                if (currentStatus === 'aguardando_contato') {
                    dateWrapper.style.display = 'block';
                } else {
                    dateWrapper.style.display = 'none';
                }
            }
            
            const modal = document.getElementById('feedbackModal');
            modal.classList.add('show');
        }

        function closeFeedback() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.remove('show');
            __currentLeadId = null;
        }

        async function saveFeedback() {
            if (!__currentLeadId) return;
            
            const input = document.getElementById('feedbackInput');
            const feedback = input.value;
            
            const statusSelect = document.getElementById('feedbackStatus');
            const status = statusSelect.value;
            
            const dateInput = document.getElementById('feedbackDate');
            let contact_scheduled_at = null;
            if (status === 'aguardando_contato' && dateInput && dateInput.value) {
                contact_scheduled_at = dateInput.value;
            }
            
            try {
                await api('/leads/' + __currentLeadId, { 
                    method: 'PUT', 
                    body: JSON.stringify({ feedback, status, contact_scheduled_at }) 
                });
                
                const lead = __leadsCache.find(l => l.id === __currentLeadId);
                let currentBatchId = null;
                if (lead) {
                    lead.feedback = feedback;
                    lead.status = status;
                    lead.contact_scheduled_at = contact_scheduled_at;
                    currentBatchId = lead.batch_id || 'avulso';
                }
                
                // Re-render to update row colors
                renderLeads(__currentFilteredLeads, currentBatchId);
                
                closeFeedback();
                toast('Salvo com sucesso!', 'success');
            } catch (err) {
                toast('Erro ao salvar: ' + err.message, 'error');
            }
        }

        function setupFilters() {
            const filterText = document.getElementById('leadsFilterText');
            const filterStatus = document.getElementById('leadsFilterStatus');
            const btnClear = document.getElementById('leadsFilterClear');
            
            // Modal events
            document.getElementById('feedbackClose').addEventListener('click', closeFeedback);
            document.getElementById('feedbackCancel').addEventListener('click', closeFeedback);
            document.getElementById('feedbackSave').addEventListener('click', saveFeedback);

            const feedbackStatus = document.getElementById('feedbackStatus');
            if (feedbackStatus) {
                feedbackStatus.addEventListener('change', function() {
                    const wrapper = document.getElementById('scheduledDateWrapper');
                    if (wrapper) {
                        wrapper.style.display = this.value === 'aguardando_contato' ? 'block' : 'none';
                    }
                });
            }

            filterText.addEventListener('input', () => loadLeads());
            filterStatus.addEventListener('change', () => loadLeads());
            [filterText, filterStatus, document.getElementById('fVendedor')].forEach(el => {
                if (!el) return;
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loadLeads();
                    }
                });
            });
            
            btnClear.addEventListener('click', () => {
                filterText.value = '';
                filterStatus.value = '';
                if(document.getElementById('fVendedor')) document.getElementById('fVendedor').value = '';
                loadLeads();
            });

            carregarUsuariosSelect();
            loadLeads();
        }

        async function checkAuth() {
            const authRaw = localStorage.getItem('authUser');
            if (!authRaw) {
                window.location.href = 'index.html';
                return;
            }
            try {
                const u = JSON.parse(authRaw);
                const label = document.getElementById('userNameLabel');
                if (label && u && u.name) label.textContent = u.name;
            } catch {
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            setupFilters();
            loadLeads();
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
