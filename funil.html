<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funil • Maxximus Telecom</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .kanban {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.75rem;
            overflow-x: hidden;
            padding-bottom: 0.25rem;
        }
        .filters {
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1fr 1fr 0.9fr;
            gap: 0.75rem;
            align-items: end;
        }
        @media (max-width: 1100px) {
            .filters { grid-template-columns: 1fr 1fr; }
        }
        .kanban-col {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 520px;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .kanban-head {
            padding: 0.75rem 0.75rem 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .kanban-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
        }
        .kanban-badge {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
        }
        .kanban-drop {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
        }
        .kanban-drop.dragover {
            outline: 2px dashed rgba(59,130,246,0.55);
            outline-offset: -6px;
            border-radius: 12px;
            background: rgba(59,130,246,0.06);
        }
        .deal {
            border: 1px solid var(--border);
            border-left: 6px solid transparent;
            background: var(--surface-strong);
            border-radius: 12px;
            padding: 0.65rem 0.7rem;
            cursor: grab;
            user-select: none;
        }
        .deal.is-open {
            background: var(--surface);
        }
        .deal:active { cursor: grabbing; }
        .deal-expanded { display: none; margin-top: 0.55rem; }
        .deal.is-open .deal-expanded { display: block; }
        .deal-chevron { width: 16px; height: 16px; color: var(--muted); transition: transform 0.15s ease; }
        .deal.is-open .deal-chevron { transform: rotate(180deg); }
        .deal-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .deal-title {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.15;
        }
        .deal-sub {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
            line-height: 1.2;
        }
        .deal-meta {
            margin-top: 0.55rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.35rem 0.6rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .deal-meta strong { color: var(--text); font-weight: 700; }
        .deal-actions {
            display:flex;
            gap:0.35rem;
            align-items:center;
        }
        .stage-1 { border-left-color: #3B82F6; }
        .stage-2 { border-left-color: #A855F7; }
        .stage-3 { border-left-color: #06B6D4; }
        .stage-4 { border-left-color: #F59E0B; }
        .stage-5 { border-left-color: #10B981; }
        .stage-6 { border-left-color: #EF4444; }
        .col-1 .kanban-head { background: rgba(59,130,246,0.10); }
        .col-2 .kanban-head { background: rgba(168,85,247,0.10); }
        .col-3 .kanban-head { background: rgba(6,182,212,0.10); }
        .col-4 .kanban-head { background: rgba(245,158,11,0.12); }
        .col-5 .kanban-head { background: rgba(16,185,129,0.10); }
        .col-6 .kanban-head { background: rgba(239,68,68,0.10); }
        @media (max-width: 900px) {
            .kanban { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="card-head">
                <div class="card-title">
                    <span>Funil</span>&nbsp;
                    <span class="chip">Propostas</span>
                </div>
                <div class="muted" style="display:flex; gap:0.5rem; align-items:center;">
                    <button id="refreshBtn" class="btn btn-ghost" type="button"><i data-lucide="refresh-cw"></i><span>Atualizar</span></button>
                    <button id="exportBtn" class="btn btn-ghost" type="button"><i data-lucide="download"></i><span>Exportar</span></button>
                </div>
            </div>
            <div class="card-body">
                <section class="section" style="margin-top: 20px;">
                    <div class="filters" style="margin-bottom: 0.75rem;">
                        <div>
                            <div class="label">Razão social</div>
                            <input id="fRazao" class="input" type="text" placeholder="Razão social / fantasia" autocomplete="off">
                        </div>
                        <div>
                            <div class="label">CNPJ</div>
                            <input id="fCnpj" class="input" type="text" placeholder="00.000.000/0000-00" autocomplete="off">
                        </div>
                        <div>
                            <div class="label">Vendedor</div>
                            <input id="fVendedor" class="input" type="text" placeholder="Nome do vendedor" autocomplete="off">
                        </div>
                        <div>
                            <div class="label">Data da proposta (de)</div>
                            <input id="fDataDe" class="input" type="date">
                        </div>
                        <div style="display: none;">
                            <div class="label">Até</div>
                            <input id="fDataAte" class="input" type="date">
                        </div>
                        <div>
                            <div class="label">Status do funil</div>
                            <select id="fStage" class="input">
                                <option value="">Todos</option>
                                <option value="1">Prospecção</option>
                                <option value="2">Negociação</option>
                                <option value="3">Cadastro</option>
                                <option value="4">Análise</option>
                                <option value="5">Finalizado</option>
                                <option value="6">Portabilidade</option>
                            </select>
                        </div>
                    </div>
                    <div class="kanban" id="kanban">
                        <div class="kanban-col col-1">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="search"></i><span>Prospecção</span></div>
                                <div class="kanban-badge" id="count-1">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="1" id="drop-1"></div>
                        </div>
                        <div class="kanban-col col-2">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="handshake"></i><span>Negociação</span></div>
                                <div class="kanban-badge" id="count-2">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="2" id="drop-2"></div>
                        </div>
                        <div class="kanban-col col-3">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="file-text"></i><span>Cadastro</span></div>
                                <div class="kanban-badge" id="count-3">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="3" id="drop-3"></div>
                        </div>
                        <div class="kanban-col col-4">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="search-check"></i><span>Análise</span></div>
                                <div class="kanban-badge" id="count-4">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="4" id="drop-4"></div>
                        </div>
                        <div class="kanban-col col-5">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="check-circle-2"></i><span>Finalizado</span></div>
                                <div class="kanban-badge" id="count-5">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="5" id="drop-5"></div>
                        </div>
                        <div class="kanban-col col-6">
                            <div class="kanban-head">
                                <div class="kanban-title"><i data-lucide="repeat"></i><span>Portabilidade</span></div>
                                <div class="kanban-badge" id="count-6">0</div>
                            </div>
                            <div class="kanban-drop" data-stage="6" id="drop-6"></div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
    <script>
        const API_BASE = 'https://others-maxximus-backend.pvuzyy.easypanel.host';
        async function api(path, options = {}) {
            const authRaw = localStorage.getItem('authUser');
            let headers = { 'Content-Type': 'application/json' };
            try {
                const u = JSON.parse(authRaw || '{}');
                if (u && u.id) headers['x-user-id'] = String(u.id);
                if (u && u.role) headers['x-user-role'] = String(u.role);
                if (u && u.name) headers['x-user-name'] = String(u.name);
            } catch {}
            const res = await fetch(API_BASE + path, { headers, ...options });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || ('HTTP ' + res.status));
            }
            return res.json();
        }
        function toast(msg, type) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.style.borderColor = type === 'error' ? 'rgba(239,68,68,0.35)' : 'rgba(16,185,129,0.35)';
            el.style.display = 'block';
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
        }
        function getStatusClass(status) {
            if (!status) return 'chip-status neutral';
            const s = String(status).toLowerCase();
            if (s.includes('entrada') || s.includes('andamento')) return 'chip-status in-progress';
            if (s.includes('pendente') || s.includes('pendência') || s.includes('pendencia') || s.includes('aguardando')) return 'chip-status pending';
            if (s.includes('validado') || s.includes('ativos') || s.includes('concluído') || s.includes('concluido') || s.includes('concluída')) return 'chip-status concluded';
            if (s.includes('reprovado') || s.includes('cancelado') || s.includes('cancelada') || s.includes('devolver')) return 'chip-status canceled';
            return 'chip-status neutral';
        }
        function etiquetaHtml(etiqueta, cor) {
            const txt = String(etiqueta || '').trim();
            if (!txt) return '';
            const c = String(cor || '').trim() || '#6B7280';
            return `<span style="display:inline-block; padding:0.12rem 0.45rem; border-radius:999px; font-weight:700; font-size:0.75rem; border:1px solid ${c}55; background:${c}22; color:${c};">${txt}</span>`;
        }
        function fmtMoney(v) {
            try { return (new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' })).format(Number(v || 0)); } catch { return 'R$ 0,00'; }
        }
        function fmtDateBR(raw) {
            if (!raw) return '-';
            const s = String(raw);
            if (s.includes('/')) return s;
            if (s.includes('-') && s.length >= 10) {
                const p = s.slice(0, 10).split('-');
                if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
            }
            try { return new Date(raw).toLocaleDateString('pt-BR'); } catch { return s; }
        }
        function parseBRDateToTime(s) {
            const v = String(s || '').trim();
            const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!m) return null;
            const day = Number(m[1]);
            const mon = Number(m[2]);
            const yr = Number(m[3]);
            const dt = new Date(yr, mon - 1, day, 12, 0, 0);
            const t = dt.getTime();
            return isFinite(t) ? t : null;
        }
        function parseISODateToTime(s, endOfDay) {
            const v = String(s || '').trim();
            if (!v) return null;
            const dt = new Date(v + (endOfDay ? 'T23:59:59' : 'T00:00:00'));
            const t = dt.getTime();
            return isFinite(t) ? t : null;
        }
        function parseAnyDateToTime(raw) {
            if (!raw) return null;
            const s = String(raw).trim();
            if (!s) return null;
            const br = parseBRDateToTime(s);
            if (br) return br;
            if (s.includes('-') && s.length >= 10) {
                const p = s.slice(0, 10).split('-');
                if (p.length === 3) {
                    const yr = Number(p[0]);
                    const mon = Number(p[1]);
                    const day = Number(p[2]);
                    const dt = new Date(yr, mon - 1, day, 12, 0, 0);
                    const t = dt.getTime();
                    return isFinite(t) ? t : null;
                }
            }
            const dt = new Date(s);
            const t = dt.getTime();
            return isFinite(t) ? t : null;
        }
        function onlyDigits(s) { return String(s || '').replace(/\D/g, ''); }
        function fmtPhone(s) {
            const p = onlyDigits(s);
            if (p.length >= 11) return `(${p.slice(0,2)}) ${p.slice(2,7)}-${p.slice(7,11)}`;
            if (p.length >= 10) return `(${p.slice(0,2)}) ${p.slice(2,6)}-${p.slice(6,10)}`;
            return p;
        }

        let __dealsAll = [];
        let __deals = [];
        let __dragId = null;
        let __isDragging = false;

        function dealHtml(d) {
            const c = d.client || {};
            const title = (c.fantasy_name || c.name || d.cnpj || '').trim() || '-';
            const sub = [d.proposta].filter(Boolean).join(' • ') || '-';
            const valor = (d.valor !== null && d.valor !== undefined) ? fmtMoney(d.valor) : '-';
            const due = c.due_date ? fmtDateBR(c.due_date) : '-';
            const createdRaw = d.created_at || d.createdAt || d.data || null;
            const created = createdRaw ? fmtDateBR(createdRaw) : '-';
            const phone = c.phone ? fmtPhone(c.phone) : '-';
            const vendedor = (d.creator && d.creator.name) ? d.creator.name : '-';
            const adminContato = String(c.rep_nome || c.gestor_nome || c.auth1_nome || '').trim() || '-';
            const totalAcessos = (d.totalAcessos !== null && d.totalAcessos !== undefined) ? String(d.totalAcessos) : '-';
            const stage = Number(d.funil_stage || 0);
            const pedidoStatus = (stage === 4 || stage === 5 || stage === 6)
                ? (d.pedido_venda_status || d.pedidoStatus || d.pedido_status || '')
                : '';
            const pedidoBadge = pedidoStatus
                ? `<span class="${getStatusClass(pedidoStatus)}" title="Status do Pedido">${pedidoStatus}</span>`
                : '';
            const pedidoEtiqueta = d.pedido_venda_etiqueta || '';
            const pedidoEtiquetaCor = d.pedido_venda_etiqueta_cor || '';
            const etiquetaBadge = pedidoEtiqueta ? etiquetaHtml(pedidoEtiqueta, pedidoEtiquetaCor) : '';
            return `
                <div class="deal stage-${d.funil_stage}" draggable="true" data-id="${d.id}">
                    <div class="deal-top">
                        <div>
                            <div class="deal-title">${title}</div>
                            <div style="grid-column: 1 / -1; font-size: 8pt !important;"><span style='font-size: 8pt !important;'>Admin:</span> <strong>${adminContato}</strong></div>
                            ${etiquetaBadge ? `<div style="margin-top: 0.35rem;">${etiquetaBadge}</div>` : ''}
                        </div>
                        <div class="deal-actions">
                            <i data-lucide="chevron-down" class="deal-chevron"></i>
                            <button type="button" style='display: none;' class="btn btn-ghost btn-icon" title="Abrir" onclick="window.openNegotiation(${d.id})"><i data-lucide="arrow-right"></i></button>
                        </div>
                    </div>
                    <div class="deal-expanded">
                        <div style="grid-column: 1 / -1; font-size: 8pt !important;"><span style='font-size: 8pt !important;'>Tel:</span> <strong>${phone || '-'}</strong></div>
                        <div style="grid-column: 1 / -1; font-size: 8pt !important;"><span style='font-size: 8pt !important;'>Vendedor:</span> <strong>${vendedor}</strong></div>
                        <div style="grid-column: 1 / -1; font-size: 8pt !important;"><span style='font-size: 8pt !important;'>Admin:</span> <strong>${adminContato}</strong></div>
                        <div class="deal-sub">${sub}</div>
                        <div class="deal-meta">
                            <div><span>Valor:</span> <strong>${valor}</strong></div>
                            <div><span>Acessos:</span> <strong>${totalAcessos}</strong></div>
                            <div><span>Criação:</span> <strong>${created}</strong></div>
                        </div>
                        ${(etiquetaBadge || pedidoBadge) ? `<div style="margin-top: 0.55rem; display: flex; justify-content: flex-end; gap: 0.35rem; align-items: center;">${etiquetaBadge || ''}${pedidoBadge || ''}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function render() {
            const byStage = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
            (__deals || []).forEach(d => {
                const s = Number(d.funil_stage || 1);
                const k = (s >= 1 && s <= 6) ? s : 1;
                byStage[k].push(d);
            });
            for (let s = 1; s <= 6; s++) {
                const drop = document.getElementById('drop-' + s);
                const cnt = document.getElementById('count-' + s);
                if (cnt) cnt.textContent = String(byStage[s].length);
                if (drop) drop.innerHTML = byStage[s].map(dealHtml).join('') || '<div class="muted">Sem propostas</div>';
            }
            bindDrag();
            bindAccordion();
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        }

        function normalizeText(s) {
            return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
        }

        function applyFilters() {
            const razao = normalizeText(document.getElementById('fRazao') ? document.getElementById('fRazao').value : '').trim();
            const cnpjNeedle = onlyDigits(document.getElementById('fCnpj') ? document.getElementById('fCnpj').value : '').trim();
            const vendedorNeedle = normalizeText(document.getElementById('fVendedor') ? document.getElementById('fVendedor').value : '').trim();
            const stageVal = String(document.getElementById('fStage') ? document.getElementById('fStage').value : '').trim();
            const deIso = document.getElementById('fDataDe') ? document.getElementById('fDataDe').value : '';
            const ateIso = document.getElementById('fDataAte') ? document.getElementById('fDataAte').value : '';
            const tDe = parseISODateToTime(deIso, false);
            const tAte = parseISODateToTime(ateIso, true);

            __deals = (__dealsAll || []).filter(d => {
                const c = d.client || {};
                if (stageVal) {
                    if (Number(d.funil_stage || 1) !== Number(stageVal)) return false;
                }
                if (cnpjNeedle) {
                    if (!onlyDigits(d.cnpj || '').includes(cnpjNeedle)) return false;
                }
                if (razao) {
                    const n1 = normalizeText(c.name);
                    const n2 = normalizeText(c.fantasy_name);
                    if (!n1.includes(razao) && !n2.includes(razao)) return false;
                }
                if (vendedorNeedle) {
                    const v = normalizeText(d.creator && d.creator.name ? d.creator.name : '');
                    if (!v.includes(vendedorNeedle)) return false;
                }
                if (tDe || tAte) {
                    const base = parseBRDateToTime(d.data) || parseAnyDateToTime(d.created_at || d.createdAt);
                    const bt = (base !== null && base !== undefined) ? Number(base) : null;
                    if (!bt || !isFinite(bt)) return false;
                    if (tDe && bt < tDe) return false;
                    if (tAte && bt > tAte) return false;
                }
                return true;
            });
            render();
        }

        function stageName(n) {
            const s = Number(n || 1);
            if (s === 1) return 'Prospecção';
            if (s === 2) return 'Negociação';
            if (s === 3) return 'Cadastro';
            if (s === 4) return 'Análise';
            if (s === 5) return 'Finalizado';
            if (s === 6) return 'Portabilidade';
            return 'Prospecção';
        }

        function exportCsv() {
            const rows = (__deals || []).map(d => {
                const c = d.client || {};
                const v = (x) => String(x === null || x === undefined ? '' : x);
                return {
                    id: v(d.id),
                    funil_stage: v(d.funil_stage),
                    funil_status: v(stageName(d.funil_stage)),
                    data_proposta: v(d.data || ''),
                    status_negociacao: v(d.status || ''),
                    valor: v(d.valor !== null && d.valor !== undefined ? d.valor : ''),
                    total_acessos: v(d.totalAcessos !== null && d.totalAcessos !== undefined ? d.totalAcessos : ''),
                    cnpj: v(d.cnpj || ''),
                    razao_social: v(c.name || ''),
                    nome_fantasia: v(c.fantasy_name || ''),
                    email: v(c.email || ''),
                    telefone: v(c.phone || ''),
                    vencimento_cliente: v(c.due_date || ''),
                    criador: v((d.creator && d.creator.name) ? d.creator.name : '')
                };
            });
            const headers = rows.length ? Object.keys(rows[0]) : [
                'id','funil_stage','funil_status','data_proposta','status_negociacao','valor','total_acessos','cnpj','razao_social','nome_fantasia','email','telefone','vencimento_cliente','criador'
            ];
            const esc = (s) => {
                const str = String(s || '');
                if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
                return str;
            };
            const csv = [headers.join(',')]
                .concat(rows.map(r => headers.map(h => esc(r[h])).join(',')))
                .join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'funil.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 0);
        }

        function bindDrag() {
            document.querySelectorAll('.deal[draggable="true"]').forEach(el => {
                el.addEventListener('dragstart', (e) => {
                    __isDragging = true;
                    __dragId = Number(el.getAttribute('data-id') || 0) || null;
                    try { e.dataTransfer.setData('text/plain', String(__dragId || '')); } catch {}
                    try { e.dataTransfer.effectAllowed = 'move'; } catch {}
                });
                el.addEventListener('dragend', () => { __dragId = null; __isDragging = false; });
            });
            document.querySelectorAll('.kanban-drop').forEach(drop => {
                drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
                drop.addEventListener('dragleave', () => { drop.classList.remove('dragover'); });
                drop.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    drop.classList.remove('dragover');
                    const stage = Number(drop.getAttribute('data-stage') || 0);
                    const idFromDT = (() => { try { return Number(e.dataTransfer.getData('text/plain') || 0); } catch { return 0; } })();
                    const id = __dragId || idFromDT;
                    if (!id || !stage) return;
                    const deal = (__deals || []).find(x => Number(x.id) === Number(id));
                    if (!deal) return;
                    const prev = Number(deal.funil_stage || 1);
                    if (prev === stage) return;
                    deal.funil_stage = stage;
                    render();
                    try {
                        await api('/negotiations/' + id + '/funnel-stage', { method: 'PUT', body: JSON.stringify({ funil_stage: stage }) });
                        if (stage === 4 || stage === 5 || stage === 6 || prev === 4 || prev === 5 || prev === 6) {
                            await load();
                        }
                    } catch (err) {
                        deal.funil_stage = prev;
                        render();
                        toast(err && err.message ? err.message : 'Erro ao atualizar funil', 'error');
                    }
                });
            });
        }

        function bindAccordion() {
            document.querySelectorAll('.deal').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (__isDragging) return;
                    const t = e.target;
                    if (t && (t.closest('button') || t.closest('a') || t.closest('input') || t.closest('select') || t.closest('textarea'))) return;
                    el.classList.toggle('is-open');
                });
            });
        }

        async function load() {
            try {
                const raw = await api('/negotiations/funnel', { method: 'GET' });
                __dealsAll = (Array.isArray(raw) ? raw : []).map(d => {
                    const createdRaw = d.created_at || d.createdAt || d.data || null;
                    if (d.created_at) return d;
                    if (!createdRaw) return d;
                    return { ...d, created_at: createdRaw };
                });
                applyFilters();
            } catch (err) {
                __dealsAll = [];
                __deals = [];
                render();
                toast(err && err.message ? err.message : 'Erro ao carregar funil', 'error');
            }
        }

        window.openNegotiation = function(id) {
            try { window.location.href = 'negociar.html?id=' + String(id); } catch {}
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = localStorage.getItem('authUser');
            if (!auth) { window.location.href = 'login.html'; return; }
            const btn = document.getElementById('refreshBtn');
            if (btn) btn.addEventListener('click', load);
            const exportBtn = document.getElementById('exportBtn');
            if (exportBtn) exportBtn.addEventListener('click', exportCsv);
            const fIds = ['fRazao','fCnpj','fVendedor','fDataDe','fDataAte','fStage'];
            fIds.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('input', applyFilters);
                el.addEventListener('change', applyFilters);
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        applyFilters();
                    }
                });
            });
            await load();
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        });
    </script>
</body>
</html>
